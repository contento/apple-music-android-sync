# Copy to sync_apple_to_android_config.toml and fill in your details.
# Paths may start with ~ for the home directory.

# Device used when --device is not given.
default_device = "internal"
# Older setting, also the fallback for the "internal" device.
android_root = "/storage/emulated/0/Music/_player"

# Exact spellings find_tag_variants.py --fix should use.
tag_overrides = []

[paths]
player_root = "~/Library/Mobile Documents/com~apple~CloudDocs/Media/_player"
apple_dir = "~/Library/Mobile Documents/com~apple~CloudDocs/Media/_player/Apple"
android_dir = "~/Library/Mobile Documents/com~apple~CloudDocs/Media/_player/Android"
source_root = "~/Library/Mobile Documents/com~apple~CloudDocs/Media/Music"

# Android music folders, picked with --device <name>.
[devices.internal]
android_root = "/storage/emulated/0/Music/_player"
# Also copy the playlists here, e.g. FiiO Music's import folder (optional).
playlist_copy_dir = "/storage/emulated/0/FiiOMusic/playlist"

[devices.a105]
android_root = "/storage/6135-3539/music/_player"
# flac_root = "/storage/6135-3539/music/_flac"   # optional, overrides the default

[flac]
source = "~/Library/Mobile Documents/com~apple~CloudDocs/Media/_flac"
target_subdir = "_flac"
